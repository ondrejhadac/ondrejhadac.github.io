<button class="btn-modal" onclick="openModal('bot-modal')">Ukázat projekt</button>

<div id="bot-modal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('bot-modal')">&times;</span>
        
        <h2>Algoritmický trading bot (MetaTrader 5)</h2>
        <p>Detailní popis vývoje obchodního robota pro měnové páry a indexy, založený na skriptování v Pythonu. Součástí projektu je také řešení komunikace mezi MT5 a vizualizace výstupů.</p>
        
        <div class="modal-gallery">
            </div>
    </div>
</div>

<style>
    /* Animace pro položky na časové ose (musíš jim v HTML přidat class="timeline-item") */
    .timeline-item {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .timeline-item:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    /* Tlačítko pro spuštění */
    .btn-modal {
        padding: 10px 20px;
        background-color: #0073b1; /* Modrá barva */
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s, transform 0.2s;
    }
    .btn-modal:hover {
        background-color: #005582;
        transform: translateY(-2px);
    }

    /* Ztmavené pozadí modalu */
    .modal-overlay {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
    }

    /* Samotné vyskakovací okno */
    .modal-content {
        background-color: #ffffff;
        margin: 8% auto;
        padding: 30px;
        border-radius: 12px;
        width: 85%;
        max-width: 800px;
        position: relative;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        animation: fadeIn 0.4s ease;
    }

    /* Křížek na zavření */
    .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        color: #999;
        font-size: 30px;
        font-weight: bold;
        cursor: pointer;
        transition: color 0.3s;
    }
    .close-btn:hover {
        color: #333;
    }

    /* Styl obrázků uvnitř okna */
    .modal-gallery img {
        width: 100%;
        border-radius: 8px;
        margin-top: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* Animace objevení */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<script>
    function openModal(id) {
        document.getElementById(id).style.display = 'block';
        document.body.style.overflow = 'hidden'; // Vypne scrollování webu v pozadí
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
        document.body.style.overflow = 'auto'; // Zapne scrollování webu
    }

    // Zavření okna při kliknutí do prázdného místa mimo něj
    window.onclick = function(event) {
        const modal = document.getElementById('bot-modal');
        if (event.target === modal) {
            closeModal('bot-modal');
        }
    }
</script>
